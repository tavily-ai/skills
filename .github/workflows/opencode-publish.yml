name: OpenCode plugin

# Publishes the @tavily/opencode-plugin npm package from .opencode-plugin/ when a release is
# published. Uses npm trusted publishing (OIDC), so the repo holds no npm token;
# the package's trusted publisher on npmjs.com must name this repo and this file.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check version
        run: |
          version=$(jq -r .version package.json)
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match .opencode-plugin/package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: ./build.sh
      - run: bun run check
      - run: bun test

      - name: Publish unless this version is already on npm
        run: |
          if npm view "@tavily/opencode-plugin@$(jq -r .version package.json)" version > /dev/null 2>&1; then
            echo "Already published"
          else
            npm publish --provenance --access public
          fi
